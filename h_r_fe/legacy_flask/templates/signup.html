{% extends "base.html" %}
{% block title %}Sign Up - StayNRide{% endblock %}
{% block content %}

<div class="auth-wrap">
  <div class="auth-card">
    <h2>Create your account</h2>
    <p class="subtitle">Join StayNRide to book stays and bikes</p>
    <div id="signupError" class="flash flash-danger" style="display:none; margin-bottom:16px;"></div>
    <form id="signupForm">
      <div class="form-group">
        <label>Full name</label>
        <input type="text" id="name" placeholder="Your name" required>
      </div>
      <div class="form-group">
        <label>Email address</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label>Phone number</label>
        <input type="tel" id="phone" placeholder="+91 9XXXXXXXXX">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="At least 6 characters" minlength="6" required>
      </div>
      <button type="submit" class="btn-solid btn-block btn-lg" id="signupBtn">Sign Up</button>
    </form>
    <div class="auth-foot">Already have an account? <a href="{{ url_for('login') }}">Log in</a></div>
  </div>
</div>

{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/pages/signup.js') }}"></script>
{% endblock %}
