{% extends "base.html" %}
{% block title %}Log In - StayNRide{% endblock %}
{% block content %}

<div class="auth-wrap">
  <div class="auth-card">
    <h2>Welcome back</h2>
    <p class="subtitle">Log in to manage your bookings</p>
    <div id="loginError" class="flash flash-danger" style="display:none; margin-bottom:16px;"></div>
    <form id="loginForm">
      <div class="form-group">
        <label>Email address</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-solid btn-block btn-lg" id="loginBtn">Log In</button>
    </form>
    <div class="auth-foot">Don't have an account? <a href="{{ url_for('signup') }}">Sign up</a></div>
  </div>
</div>

{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/pages/login.js') }}"></script>
{% endblock %}
